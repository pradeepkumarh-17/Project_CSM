<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>MindCare | Results</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(120deg, #f6fff0 0%, #fff0f6 100%);
            color: #222;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 28px;
        }
        
        .hero {
            background: linear-gradient(90deg, #b8e6cf 10%, #c8b9f2 100%);
            border-radius: 18px;
            padding: 46px 36px;
            margin: 20px 0 40px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(10, 10, 10, 0.06);
        }
        
        .hero .hero-sub {
            color: #7c7c7c;
            margin-bottom: 8px;
        }
        
        .hero .hero-title {
            font-weight: 600;
            color: #fff;
            margin-bottom: 12px;
        }
        
        .hero .hero-level {
            font-size: 44px;
            font-weight: 800;
            color: #ff9800;
            margin-bottom: 8px;
        }
        
        .hero .hero-conf {
            color: #fff;
            opacity: 0.9;
            margin-bottom: 6px;
        }
        
        .hero .hero-note {
            color: #fff;
            opacity: 0.85;
            font-size: 13px;
        }
        
        .phases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 36px;
        }
        
        .phase-card {
            background: #fff;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }
        
        .phase-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .phase-title {
            font-weight: 700;
        }
        
        .badge {
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 13px;
            color: #fff;
        }
        
        .badge.high {
            background: #ff6b6b;
        }
        
        .badge.medium {
            background: #ffb74d;
        }
        
        .badge.low {
            background: #5ac18e;
        }
        
        .metric {
            color: #555;
            margin: 6px 0;
        }
        
        .progress-wrap {
            height: 8px;
            background: #eef6f2;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #a7e6cb, #c7b9f2);
            width: 0%;
            transition: width 0.6s ease;
        }
        
        .recommendations {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 48px;
        }
        
        .rec-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px 18px 18px 18px;
            box-shadow: 0 12px 28px rgba(20, 20, 40, 0.06);
            min-width: 220px;
            position: relative;
            overflow: visible;
        }
        
        .rec-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        
        .rec-icon {
            font-size: 22px;
        }
        
        .rec-title {
            font-size: 18px;
            font-weight: 700;
            color: #222;
        }
        
        .rec-category {
            position: absolute;
            right: 14px;
            top: 14px;
            background: rgba(230, 230, 255, 0.9);
            color: #556;
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 12px;
        }
        
        .rec-desc {
            color: #666;
            margin: 10px 0 14px;
        }
        
        .rec-btn {
            display: block;
            width: 100%;
            text-align: center;
            padding: 12px 14px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(90deg, #9de6c7, #cbb7f3);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(160, 160, 200, 0.12);
        }
        
        .rec-btn .play {
            margin-right: 8px;
            opacity: 0.95;
        }
        
        @media (max-width: 1000px) {
            .recommendations {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 700px) {
            .recommendations {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 700px) {
            .hero .hero-level {
                font-size: 28px;
            }
            .phases-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

            const normalize = (s) =>
                s && s.toString ?
                s.toString().charAt(0).toUpperCase() +
                s.toString().slice(1).toLowerCase() :
                "";

            function renderHero(level, confidence) {
                const lvl = normalize(level) || "Medium";
                document.getElementById("hero-level").textContent = `${lvl} Stress`;
                document.getElementById("hero-conf").textContent = `${Number(
            confidence || 0
          ).toFixed(1)}% Confidence`;
            }

            function badgeFor(level) {
                const l = normalize(level);
                if (l === "High")
                    return '<span class="badge high">High Stress</span>';
                if (l === "Medium")
                    return '<span class="badge medium">Medium Stress</span>';
                if (l === "Low") return '<span class="badge low">Low Stress</span>';
                return '<span class="badge">N/A</span>';
            }

            function renderPhaseCard(phase, elId, title) {
                const el = document.getElementById(elId);
                const lvl = normalize(phase.stressLevel) || "Unavailable";
                const conf = Number(phase.confidence || 0).toFixed(1);
                let body = `<div class="phase-header"><div class="phase-title">${title}</div>${badgeFor(
            lvl
          )}</div>`;
                if (phase.emotion)
                    body += `<div class="metric">🎭 Emotion: <strong>${phase.emotion}</strong></div>`;
                if (phase.pitch !== undefined)
                    body += `<div class="metric">🎵 Pitch: <strong>${phase.pitch} Hz</strong></div>`;
                if (phase.score !== undefined)
                    body += `<div class="metric">📊 Score: <strong>${phase.score}%</strong></div>`;
                body += `<div class="metric">✓ Confidence: <strong>${conf}%</strong></div>`;
                body += `<div class="progress-wrap"><div class="progress-bar" style="width:${Math.min(
            100,
            Math.max(0, conf)
          )}%"></div></div>`;
                el.innerHTML = body;
            }

            function renderRecommendations(level) {
                const container = document.getElementById("recommendations");
                container.innerHTML = "";
                const key = normalize(level) || "Medium";
                const list = RECOMMENDATIONS[key] || RECOMMENDATIONS.Medium || [];
                if (!list.length) {
                    container.innerHTML =
                        '<div style="color:#666">No recommendations available.</div>';
                    return;
                }

                list.forEach((rec) => {
                    const card = document.createElement("div");
                    card.className = "rec-card";

                    // header (icon + title)
                    const header = document.createElement("div");
                    header.className = "rec-header";
                    const icon = document.createElement("div");
                    icon.className = "rec-icon";
                    icon.textContent = rec.icon || "🧠";
                    const title = document.createElement("div");
                    title.className = "rec-title";
                    title.textContent = rec.title || "";
                    header.appendChild(icon);
                    header.appendChild(title);

                    // category badge
                    const cat = document.createElement("div");
                    cat.className = "rec-category";
                    cat.textContent = rec.category || "";
                    card.appendChild(cat);

                    card.appendChild(header);

                    // description
                    const desc = document.createElement("div");
                    desc.className = "rec-desc";
                    desc.textContent = rec.description || "";
                    card.appendChild(desc);

                    // action button full width
                    const btn = document.createElement("button");
                    btn.className = "rec-btn";
                    btn.innerHTML = `<span class="play">▶</span>${
              rec.action || "Open"
            }`;
                    btn.onclick = () => showPlanDetail(rec);
                    card.appendChild(btn);

                    container.appendChild(card);
                });
            }

            // Modal builder (keeps same behavior)
            function showPlanDetail(rec) {
                let modal = document.getElementById("planModal");
                if (!modal) {
                    modal = document.createElement("div");
                    modal.id = "planModal";
                    modal.style =
                        "position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:9999;";
                    modal.innerHTML = `<div id='planContent' style='background:#fff;border-radius:12px;max-width:900px;width:90%;padding:20px;overflow:auto;max-height:80vh;'></div>`;
                    modal.onclick = (e) => {
                        if (e.target === modal) modal.remove();
                    };
                    document.body.appendChild(modal);
                }
                const content = document.getElementById("planContent");
                content.innerHTML = `
                  <div style='display:flex;justify-content:space-between;align-items:center'>
                    <div style='font-size:22px'>${rec.icon} <strong>${
            rec.title
          }</strong></div>
                    <button onclick='document.getElementById("planModal").remove()' style='padding:8px 12px;border-radius:8px;border:none;background:#eee;cursor:pointer'>Close</button>
                  </div>
                  <p style='color:#555;margin-top:10px'>${rec.description}</p>
                  <div style='margin-top:12px'><strong>Details:</strong></div>
                  <ul style='margin-top:8px'>${rec.content.items
                    .map((i) => `<li>${i}</li>`)
                    .join("")}</ul>
                `;
          if (rec.content.videoUrl)
            content.innerHTML += `<div style='margin-top:12px'><iframe width='100%' height='360' src='${rec.content.videoUrl}' frameborder='0' allowfullscreen></iframe></div>`;
          else if (rec.content.audioUrl)
            content.innerHTML += `<div style='margin-top:12px'><iframe width='100%' height='180' src='${rec.content.audioUrl}' frameborder='0' allowfullscreen></iframe></div>`;
        }

        // Initial render — fill hero, phases and recommendations
        const chosenLevel = normalize(result.stressLevel) || "Medium";
        const conf = Number(result.confidence) || 0;
        renderHero(chosenLevel, conf);
        renderPhaseCard(result.phase1 || {}, "faceCard", "Facial Analysis");
        renderPhaseCard(result.phase2 || {}, "voiceCard", "Voice Analysis");
        renderPhaseCard(result.phase3 || {}, "surveyCard", "Survey Analysis");
        renderRecommendations(chosenLevel);

        // Attach button handlers
        (function () {
          const dashboardBtn = document.getElementById("dashboardBtn");
          if (dashboardBtn) {
            dashboardBtn.addEventListener("click", function () {
              // Try absolute path first, then relative fallback
              fetch("/dashboard.html", { method: "HEAD" })
                .then((resp) => {
                  if (resp.ok) window.location.href = "/dashboard.html";
                  else {
                    fetch("../dashboard.html", { method: "HEAD" })
                      .then((r2) => {
                        if (r2.ok) window.location.href = "../dashboard.html";
                        else {
                          alert(
                            "Dashboard page not found. Please navigate manually to the dashboard."
                          );
                        }
                      })
                      .catch(() => {
                        window.location.href = "/dashboard.html";
                      });
                  }
                })
                .catch(() => {
                  window.location.href = "../dashboard.html";
                });
            });
          }

          const downloadBtn = document.getElementById("downloadPdfBtn");
          if (downloadBtn) {
            downloadBtn.addEventListener("click", async function () {
              const btn = this;
              btn.disabled = true;
              const originalText = btn.textContent;
              btn.textContent = "Generating PDF…";
              try {
                // Rebuild a minimal, deterministic results-only document from `result`
                const wrap = document.createElement("div");
                wrap.style.background = "#fff";
                wrap.style.padding = "20px";
                wrap.style.color = "#222";

                // Title + timestamp
                const title = document.createElement("div");
                title.innerHTML = `<h1 style="text-align:center;margin:0 0 8px">Assessment Results</h1><div style="text-align:center;color:#666;margin-bottom:16px;font-size:13px">Generated: ${new Date().toLocaleString()}</div>`;
                wrap.appendChild(title);

                // Hero summary (use `result` as source of truth, fallback to DOM)
                const heroBox = document.createElement("div");
                heroBox.style =
                  "background:linear-gradient(90deg,#b8e6cf 10%,#c8b9f2 100%);border-radius:12px;padding:18px;margin-bottom:12px;text-align:center;color:#fff";
                const lvlText =
                  result && result.stressLevel
                    ? normalize(result.stressLevel) + " Stress"
                    : document.getElementById("hero-level").textContent;
                const confText =
                  result && result.confidence !== undefined
                    ? Number(result.confidence).toFixed(1) + "% Confidence"
                    : document.getElementById("hero-conf").textContent;
                heroBox.innerHTML = `<div style="font-weight:700;font-size:20px;margin-bottom:6px">${lvlText}</div><div style="opacity:0.95">${confText}</div>`;
                wrap.appendChild(heroBox);

                // Build compact phase cards from the `result` object
                const grid = document.createElement("div");
                grid.style =
                  "display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:8px";
                function buildPhaseCard(title, phase) {
                  const card = document.createElement("div");
                  card.style =
                    "background:#fff;border-radius:8px;padding:12px;border:1px solid #eee";
                  const lvl =
                    phase && phase.stressLevel
                      ? normalize(phase.stressLevel)
                      : "Unavailable";
                  const conf =
                    phase && phase.confidence !== undefined
                      ? Number(phase.confidence).toFixed(1)
                      : "0.0";
                  let html = `<div style="font-weight:700;margin-bottom:8px">${title}</div>`;
                  html += `<div style="margin-bottom:6px"><strong>Stress:</strong> ${lvl}</div>`;
                  if (phase && phase.emotion)
                    html += `<div style="margin-bottom:4px"><strong>Emotion:</strong> ${phase.emotion}</div>`;
                  if (phase && phase.pitch !== undefined)
                    html += `<div style="margin-bottom:4px"><strong>Pitch:</strong> ${phase.pitch} Hz</div>`;
                  if (phase && phase.score !== undefined)
                    html += `<div style="margin-bottom:4px"><strong>Score:</strong> ${phase.score}%</div>`;
                  html += `<div style="margin-top:8px;color:#666"><strong>Confidence:</strong> ${conf}%</div>`;
                  card.innerHTML = html;
                  return card;
                }
                grid.appendChild(
                  buildPhaseCard("Facial Analysis", result.phase1 || {})
                );
                grid.appendChild(
                  buildPhaseCard("Voice Analysis", result.phase2 || {})
                );
                grid.appendChild(
                  buildPhaseCard("Survey Analysis", result.phase3 || {})
                );
                wrap.appendChild(grid);

                const opt = {
                  margin: 10,
                  filename: `mindcare_results_${new Date()
                    .toISOString()
                    .slice(0, 19)
                    .replace(/[:T]/g, "-")}.pdf`,
                  image: { type: "jpeg", quality: 0.98 },
                  html2canvas: { scale: 2, useCORS: true },
                  jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
                };

                await html2pdf().from(wrap).set(opt).save();
              } catch (err) {
                console.error("PDF generation failed", err);
                alert(
                  "Failed to generate PDF. Please check your internet connection and try again."
                );
              } finally {
                btn.disabled = false;
                btn.textContent = originalText;
              }
            });
          }
        })();
        </script>
    </div>
</body>

</html>
